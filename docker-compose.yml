services:
  auth-service:
    build: ./auth-service
    image: ${CI_REGISTRY_IMAGE:-microservices}/auth-service:${IMAGE_TAG:-latest}
    ports:
      - "5001:5000"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      DEMO_USERNAME: ${DEMO_USERNAME:-admin}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-password}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-microservices}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app-password}
    depends_on:
      mysql:
        condition: service_healthy

  products-service:
    build: ./products-service
    image: ${CI_REGISTRY_IMAGE:-microservices}/products-service:${IMAGE_TAG:-latest}
    ports:
      - "5002:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-microservices}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app-password}
    depends_on:
      mysql:
        condition: service_healthy

  orders-service:
    build: ./orders-service
    image: ${CI_REGISTRY_IMAGE:-microservices}/orders-service:${IMAGE_TAG:-latest}
    ports:
      - "5003:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-microservices}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app-password}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
    depends_on:
      - auth-service
      - products-service
      - orders-service

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-microservices}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data: