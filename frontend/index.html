<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08111f">
  <title>Mercury Commerce</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['DM Sans', 'sans-serif'] }, colors: { ink: '#08111f', mint: '#75e0bc' } } } };</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #08111f; color: #e8f0fb; font-family: 'DM Sans', sans-serif; }
    body:before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .22; background: radial-gradient(circle at 80% 0%, #1e4770 0, transparent 32%), linear-gradient(120deg, rgba(117,224,188,.035), transparent 45%); }
    .mono { font-family: 'Space Mono', monospace; } .panel { border: 1px solid #263952; background: rgba(14, 28, 49, .82); box-shadow: 0 18px 50px rgba(0,0,0,.18); }
    .input { width: 100%; border: 1px solid #304664; border-radius: 10px; background: #0c1b2e; color: #f4f8ff; padding: 11px 13px; outline: none; } .input:focus { border-color: #75e0bc; box-shadow: 0 0 0 3px rgba(117,224,188,.12); }
    .btn { border-radius: 9px; padding: 10px 14px; font-weight: 700; transition: transform .15s, opacity .2s; } .btn:hover { transform: translateY(-1px); } .btn:disabled { cursor: wait; opacity: .55; transform: none; }
    .drawer { animation: slide .25s ease both; } .reveal { animation: reveal .4s ease both; } @keyframes slide { from { transform: translateX(100%); } to { transform: translateX(0); } } @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useEffect, useState } = React;
    const SERVICES = { auth: { name: 'Auth Service', url: 'http://localhost:5001', endpoint: '/login', color: '#8ab4ff' }, products: { name: 'Products Service', url: 'http://localhost:5002', endpoint: '/health', color: '#75e0bc' }, orders: { name: 'Orders Service', url: 'http://localhost:5003', endpoint: '/health', color: '#ffb86b' } };
    const NAV = [{ id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' }, { id: 'catalog', label: 'Product Catalog', icon: 'package-search' }, { id: 'orders', label: 'Active Orders', icon: 'clipboard-list' }, { id: 'health', label: 'System Health', icon: 'activity' }];
    const PRODUCT_IMAGES = {
      1: 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=900&q=85',
      2: 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=900&q=85',
      3: 'https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&w=900&q=85',
      4: 'https://images.unsplash.com/photo-1527814050087-3793815479db?auto=format&fit=crop&w=900&q=85',
      5: 'https://images.unsplash.com/photo-1625842268584-8f3296236761?auto=format&fit=crop&w=900&q=85'
    };
    function Icon({ name, size = 17 }) { return <i data-lucide={name} width={size} height={size} aria-hidden="true" />; }
    function App() {
      const [view, setView] = useState('dashboard'); const [products, setProducts] = useState([]); const [orders, setOrders] = useState([]); const [cart, setCart] = useState([]); const [cartOpen, setCartOpen] = useState(false); const [health, setHealth] = useState({}); const [busy, setBusy] = useState({}); const [notice, setNotice] = useState(null);
      const [token, setToken] = useState(() => localStorage.getItem('mercury_jwt')); const [credentials, setCredentials] = useState({ username: 'admin', password: 'password' });
      const authenticated = Boolean(token); const userLabel = authenticated ? (localStorage.getItem('mercury_user') || 'admin') : 'Guest';
      const request = async (url, options = {}) => { const response = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}), ...(options.headers || {}) } }); const text = await response.text(); let data; try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text }; } if (!response.ok) throw new Error(data.error || data.message || `Request failed (${response.status})`); return data; };
      const run = async (key, action) => { setBusy(state => ({ ...state, [key]: true })); setNotice(null); try { await action(); } catch (error) { setNotice({ type: 'error', message: error.message + ' Check that the service is running.' }); } finally { setBusy(state => ({ ...state, [key]: false })); } };
      const loadProducts = () => run('products', async () => { const data = await request('http://localhost:5002/products'); setProducts(data.map(product => ({ ...product, image: PRODUCT_IMAGES[product.id] }))); });
      const loadOrders = () => run('orders', async () => { setOrders(await request('http://localhost:5003/orders')); });
      const login = event => { event.preventDefault(); run('login', async () => { const data = await request('http://localhost:5001/login', { method: 'POST', body: JSON.stringify(credentials) }); localStorage.setItem('mercury_jwt', data.token); localStorage.setItem('mercury_user', credentials.username); setToken(data.token); setNotice({ type: 'success', message: 'You are signed in and your session is saved locally.' }); }); };
      const logout = () => { localStorage.removeItem('mercury_jwt'); localStorage.removeItem('mercury_user'); setToken(null); setNotice({ type: 'info', message: 'Signed out.' }); };
      const addToCart = product => { setCart(current => { const item = current.find(entry => entry.id === product.id); return item ? current.map(entry => entry.id === product.id ? { ...entry, quantity: entry.quantity + 1 } : entry) : [...current, { ...product, quantity: 1 }]; }); setNotice({ type: 'success', message: `${product.name} added to your cart.` }); };
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0); const total = cart.reduce((sum, item) => sum + Number(item.price) * item.quantity, 0);
      const changeQuantity = (id, delta) => setCart(current => current.map(item => item.id === id ? { ...item, quantity: item.quantity + delta } : item).filter(item => item.quantity > 0));
      const checkout = () => run('checkout', async () => { if (!cart.length) throw new Error('Your cart is empty'); const payload = { items: cart.map(item => ({ product_id: item.id, quantity: item.quantity, unit_price: item.price })), total: Number(total.toFixed(2)), product_id: cart[0].id, quantity: cart.reduce((sum, item) => sum + item.quantity, 0), status: 'pending' }; const saved = await request('http://localhost:5003/orders', { method: 'POST', body: JSON.stringify(payload) }); setOrders(current => [saved, ...current]); setCart([]); setCartOpen(false); setView('orders'); setNotice({ type: 'success', message: `Order #${saved.id} placed successfully.` }); });
      const checkHealth = async () => { const results = {}; await Promise.all(Object.entries(SERVICES).map(async ([key, service]) => { try { const options = key === 'auth' ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'admin', password: 'password' }) } : { method: 'GET' }; await fetch(service.url + service.endpoint, { ...options, cache: 'no-store' }); results[key] = true; } catch { results[key] = false; } })); setHealth(results); };
      useEffect(() => { loadProducts(); loadOrders(); checkHealth(); const timer = setInterval(checkHealth, 10000); return () => clearInterval(timer); }, []);
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [view, cartOpen, products, orders, notice, token]);
      const active = NAV.find(item => item.id === view) || NAV[0];
      const navButton = item => <button key={item.id} onClick={() => setView(item.id)} className={'flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left text-sm font-semibold transition ' + (view === item.id ? 'bg-mint/10 text-mint' : 'text-slate-400 hover:bg-white/5 hover:text-white')}><Icon name={item.icon} />{item.label}</button>;
      return <div className="relative min-h-screen"><aside className="fixed inset-y-0 left-0 z-20 hidden w-64 border-r border-slate-800 bg-[#091525]/95 px-4 py-6 lg:block"><div className="mb-10 flex items-center gap-3 px-3"><div className="relative flex h-10 w-10 items-center justify-center overflow-hidden rounded-xl bg-gradient-to-br from-mint via-cyan-300 to-sky-400 text-ink shadow-[0_0_24px_rgba(117,224,188,.22)]"><span className="absolute -right-1 -top-2 h-6 w-6 rounded-full bg-white/40 blur-md" /><Icon name="boxes" size={20} /></div><div><div className="font-bold tracking-tight">Mercury</div><div className="mono text-[10px] uppercase tracking-widest text-slate-500">commerce OS</div></div></div><div className="mono mb-3 px-3 text-[10px] uppercase tracking-[.2em] text-slate-600">Workspace</div><nav className="space-y-1">{NAV.map(navButton)}</nav><div className="absolute bottom-6 left-4 right-4 rounded-xl border border-slate-800 bg-slate-900/70 p-3"><div className="mono mb-2 text-[10px] uppercase tracking-widest text-slate-500">Environment</div><div className="flex items-center gap-2 text-sm"><span className="h-2 w-2 rounded-full bg-mint shadow-[0_0_10px_#75e0bc]" />Local development</div></div></aside>
        <div className="lg:pl-64"><header className="sticky top-0 z-10 flex h-20 items-center justify-between border-b border-slate-800/80 bg-[#08111f]/90 px-4 backdrop-blur-xl sm:px-8"><div><div className="mono text-[10px] uppercase tracking-[.2em] text-slate-500">{active.id}</div><h1 className="text-xl font-bold">{active.label}</h1></div><div className="flex items-center gap-3"><HealthStrip health={health} /><button aria-label="Open shopping cart" className="relative rounded-lg border border-slate-700 p-2.5 text-slate-300 hover:text-white" onClick={() => setCartOpen(true)}><Icon name="shopping-cart" /><span className="absolute -right-2 -top-2 flex h-5 min-w-5 items-center justify-center rounded-full bg-mint px-1 text-[10px] font-bold text-ink">{cartCount}</span></button><div className="hidden items-center gap-3 border-l border-slate-700 pl-3 sm:flex"><div className="flex h-8 w-8 items-center justify-center rounded-full bg-sky-400/15 text-sm font-bold text-sky-200">{userLabel[0].toUpperCase()}</div><div><div className="text-sm font-semibold">{userLabel}</div><button className="text-xs text-slate-500 hover:text-mint" onClick={authenticated ? logout : () => setView('dashboard')}>{authenticated ? 'Sign out' : 'Sign in below'}</button></div></div></div></header>
          <main className="relative mx-auto max-w-7xl px-4 py-7 sm:px-8 sm:py-10"><div className="mb-6 flex gap-1 overflow-x-auto rounded-xl border border-slate-800 bg-slate-900/60 p-1 lg:hidden">{NAV.map(navButton)}</div>{notice && <div className={'mb-5 rounded-lg border px-4 py-3 text-sm ' + (notice.type === 'error' ? 'border-red-400/30 bg-red-400/10 text-red-200' : 'border-mint/30 bg-mint/10 text-mint')} role="status">{notice.message}</div>}{view === 'dashboard' && <Dashboard products={products} orders={orders} cartCount={cartCount} total={total} authenticated={authenticated} credentials={credentials} setCredentials={setCredentials} login={login} setView={setView} addToCart={addToCart} busy={busy} />}{view === 'catalog' && <Catalog products={products} addToCart={addToCart} loadProducts={loadProducts} busy={busy} />}{view === 'orders' && <Orders orders={orders} loadOrders={loadOrders} busy={busy} />}{view === 'health' && <HealthPage health={health} checkHealth={checkHealth} busy={busy} />}</main></div>
        {cartOpen && <><button aria-label="Close cart overlay" className="fixed inset-0 z-30 bg-black/60" onClick={() => setCartOpen(false)} /><aside className="drawer fixed right-0 top-0 z-40 flex h-full w-full max-w-md flex-col border-l border-slate-700 bg-[#0b1728] p-5 shadow-2xl"><div className="flex items-center justify-between border-b border-slate-700 pb-5"><div><div className="mono text-[10px] uppercase tracking-widest text-mint">Your bag</div><h2 className="mt-1 text-xl font-bold">Shopping cart <span className="text-slate-500">({cartCount})</span></h2></div><button aria-label="Close shopping cart" className="rounded-lg p-2 text-slate-400 hover:bg-white/5 hover:text-white" onClick={() => setCartOpen(false)}><Icon name="x" /></button></div><div className="flex-1 overflow-y-auto py-5">{cart.length ? <div className="space-y-4">{cart.map(item => <div className="flex gap-3 rounded-xl border border-slate-700 bg-slate-900/60 p-3" key={item.id}><div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-lg bg-sky-400/10 text-sky-200"><Icon name="package" /></div><div className="min-w-0 flex-1"><div className="truncate font-semibold">{item.name}</div><div className="mt-1 text-sm text-mint">${Number(item.price).toFixed(2)}</div><div className="mt-2 flex items-center gap-2"><button className="rounded border border-slate-600 px-2 text-slate-300" onClick={() => changeQuantity(item.id, -1)}>-</button><span className="mono text-xs">{item.quantity}</span><button className="rounded border border-slate-600 px-2 text-slate-300" onClick={() => changeQuantity(item.id, 1)}>+</button></div></div></div>)}</div> : <div className="flex h-full flex-col items-center justify-center text-center text-slate-500"><Icon name="shopping-bag" size={32} /><p className="mt-3 text-sm">Your cart is waiting for something good.</p></div>}</div><div className="border-t border-slate-700 pt-5"><div className="mb-4 flex justify-between text-lg font-bold"><span>Total</span><span className="text-mint">${total.toFixed(2)}</span></div><button className="btn w-full bg-mint text-ink" onClick={checkout} disabled={!cart.length || busy.checkout}>{busy.checkout ? 'Sending order...' : 'Checkout'}</button><div className="mono mt-3 text-center text-[10px] text-slate-600">POST /orders · port 5003</div></div></aside></>}
      </div>;
    }
    function HealthStrip({ health }) { return <div className="hidden items-center gap-3 rounded-lg border border-slate-800 bg-slate-900/60 px-3 py-2 md:flex">{Object.entries(SERVICES).map(([key, service]) => <div className="flex items-center gap-1.5 text-[11px] text-slate-400" key={key} title={service.name}><span className={'h-1.5 w-1.5 rounded-full ' + (health[key] ? 'bg-mint shadow-[0_0_8px_#75e0bc]' : 'bg-red-400')} />{key}</div>)}</div>; }
    function Dashboard({ products, orders, cartCount, total, authenticated, credentials, setCredentials, login, setView, addToCart, busy }) { return <div className="reveal"><div className="relative mb-8 overflow-hidden rounded-2xl border border-sky-300/20 bg-gradient-to-br from-[#123252] via-[#10263d] to-[#0b1829] p-6 sm:p-8"><div className="absolute -right-12 -top-20 h-64 w-64 rounded-full border-[28px] border-mint/10" /><div className="absolute right-20 top-10 h-20 w-20 rounded-full bg-sky-300/10 blur-2xl" /><div className="relative max-w-2xl"><div className="mono mb-3 flex items-center gap-2 text-xs uppercase tracking-[.2em] text-mint"><Icon name="sparkles" size={14} />Mercury workspace</div><h2 className="text-3xl font-bold tracking-tight sm:text-4xl">A clearer view of commerce.</h2><p className="mt-3 max-w-lg text-sm leading-6 text-slate-300">Keep your catalog moving, turn demand into orders, and see every service at a glance.</p><button className="btn mt-6 inline-flex items-center gap-2 bg-mint text-ink" onClick={() => setView('catalog')}><Icon name="arrow-up-right" size={16} />Explore catalog</button></div></div><div className="mb-8 flex flex-col justify-between gap-4 md:flex-row md:items-end"><div><div className="mono mb-2 text-xs uppercase tracking-[.2em] text-mint">Good to see you</div><h2 className="text-3xl font-bold tracking-tight sm:text-4xl">Your commerce cockpit.</h2><p className="mt-2 text-slate-400">Monitor inventory, move orders, and keep your storefront flowing.</p></div><button className="btn flex items-center justify-center gap-2 border border-slate-600 text-slate-200" onClick={() => setView('catalog')}><Icon name="plus" size={16} />Browse catalog</button></div><div className="mb-8 grid gap-4 sm:grid-cols-3"><Metric icon="package" label="Products live" value={products.length || '—'} accent="text-mint" /><Metric icon="clipboard-check" label="Active orders" value={orders.length || '—'} accent="text-orange-300" /><Metric icon="shopping-cart" label="Cart value" value={cartCount ? `$${total.toFixed(2)}` : 'Empty'} accent="text-sky-300" /></div><div className="grid gap-6 xl:grid-cols-[1.35fr_.65fr]"><div className="panel rounded-2xl p-5 sm:p-7"><div className="mb-6 flex items-center justify-between"><div><div className="mono text-xs text-slate-500">CURATED STOCK</div><h3 className="mt-1 text-xl font-bold">Featured catalog</h3></div><button className="text-sm font-semibold text-mint" onClick={() => setView('catalog')}>View all <Icon name="arrow-up-right" size={14} /></button></div><div className="grid gap-3 sm:grid-cols-2">{products.slice(0, 4).map(product => <ProductCard key={product.id} product={product} addToCart={addToCart} />)}</div>{!products.length && <Empty text="Loading product catalog..." />}</div><div className="panel rounded-2xl p-6"><div className="mono text-xs text-sky-300">ACCOUNT</div><h3 className="mt-2 text-xl font-bold">{authenticated ? 'You are signed in' : 'Sign in to continue'}</h3>{authenticated ? <p className="mt-3 text-sm leading-6 text-slate-400">Your session is persisted in this browser. Checkout is ready when you are.</p> : <form onSubmit={login} className="mt-5 space-y-3"><input className="input" aria-label="Username" value={credentials.username} onChange={e => setCredentials({ ...credentials, username: e.target.value })} /><input className="input" aria-label="Password" type="password" value={credentials.password} onChange={e => setCredentials({ ...credentials, password: e.target.value })} /><button className="btn w-full bg-sky-300 text-ink" disabled={busy.login}>{busy.login ? 'Signing in...' : 'Sign in'}</button></form>}</div></div></div>; }
    function Metric({ icon, label, value, accent }) { return <div className="panel rounded-xl p-5"><div className="mb-5 flex h-9 w-9 items-center justify-center rounded-lg bg-white/5 text-slate-300"><Icon name={icon} size={17} /></div><div className="text-sm text-slate-500">{label}</div><div className={'mt-1 text-2xl font-bold ' + accent}>{value}</div></div>; }
    function ProductCard({ product, addToCart }) { const stock = product.stock ?? 24; return <article className="group rounded-xl border border-slate-700 bg-[#0c1a2c] p-4 transition hover:-translate-y-1 hover:border-slate-500"><div className="relative mb-5 aspect-[16/10] overflow-hidden rounded-lg bg-slate-800"><img className="h-full w-full object-cover transition duration-500 group-hover:scale-105" src={product.image || PRODUCT_IMAGES[product.id]} alt={product.name} loading="lazy" onError={event => { event.currentTarget.src = 'https://images.unsplash.com/photo-1517336714739-489689fd1ca8?auto=format&fit=crop&w=900&q=80'; }} /><div className="absolute inset-0 bg-gradient-to-t from-[#08111f]/55 via-transparent to-transparent" /></div><div className="mono text-[10px] uppercase tracking-widest text-slate-600">SKU-{String(product.id).padStart(3, '0')}</div><h4 className="mt-1 truncate font-semibold">{product.name}</h4><div className="mt-3 flex items-end justify-between"><span className="text-lg font-bold text-mint">${Number(product.price).toFixed(2)}</span><span className="text-xs text-slate-500">{stock} in stock</span></div><button className="btn mt-4 flex w-full items-center justify-center gap-2 border border-slate-600 text-sm text-slate-200 hover:border-mint hover:text-mint" onClick={() => addToCart(product)}><Icon name="shopping-cart" size={15} />Add to cart</button></article>; }
    function Catalog({ products, addToCart, loadProducts, busy }) { return <div className="reveal"><div className="mb-7 flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><div className="mono text-xs text-mint">INVENTORY / LIVE</div><h2 className="mt-2 text-3xl font-bold">Product catalog</h2><p className="mt-2 text-slate-400">Everything your team can order from the current inventory.</p></div><button className="btn flex items-center justify-center gap-2 border border-slate-600 text-slate-200" onClick={loadProducts} disabled={busy.products}><Icon name="refresh-cw" size={15} />{busy.products ? 'Refreshing...' : 'Refresh catalog'}</button></div><div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">{products.map(product => <ProductCard key={product.id} product={product} addToCart={addToCart} />)}</div>{!products.length && <Empty text="No products available." />}</div>; }
    function Orders({ orders, loadOrders, busy }) { return <div className="reveal"><div className="mb-7 flex items-end justify-between"><div><div className="mono text-xs text-orange-300">FULFILLMENT / LIVE</div><h2 className="mt-2 text-3xl font-bold">Active orders</h2><p className="mt-2 text-slate-400">Track the latest order activity from the Orders Service.</p></div><button className="btn flex items-center gap-2 border border-slate-600 text-slate-200" onClick={loadOrders} disabled={busy.orders}><Icon name="refresh-cw" size={15} />Refresh</button></div><div className="panel overflow-hidden rounded-2xl">{orders.length ? orders.map(order => <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 p-5 last:border-0" key={order.id}><div className="flex items-center gap-4"><div className="flex h-10 w-10 items-center justify-center rounded-lg bg-orange-300/10 text-orange-200"><Icon name="package-check" /></div><div><div className="font-semibold">Order #{order.id}</div><div className="mono mt-1 text-xs text-slate-500">Product {order.product_id} · Qty {order.quantity}</div></div></div><span className="rounded-full bg-orange-300/10 px-3 py-1 text-xs font-semibold text-orange-200">{order.status}</span></div>) : <Empty text="No active orders yet." />}</div></div>; }
    function HealthPage({ health, checkHealth, busy }) { return <div className="reveal"><div className="mb-7 flex items-end justify-between"><div><div className="mono text-xs text-mint">OBSERVABILITY / POLL 10S</div><h2 className="mt-2 text-3xl font-bold">System health</h2><p className="mt-2 text-slate-400">Live connectivity checks across the local service mesh.</p></div><button className="btn flex items-center gap-2 border border-slate-600 text-slate-200" onClick={checkHealth} disabled={busy.health}><Icon name="activity" size={15} />Run check</button></div><div className="grid gap-4 md:grid-cols-3">{Object.entries(SERVICES).map(([key, service]) => <div className="panel rounded-2xl p-6" key={key}><div className="flex items-center justify-between"><div className="flex h-11 w-11 items-center justify-center rounded-xl bg-white/5"><Icon name="server" /></div><span className={'flex items-center gap-2 text-sm font-semibold ' + (health[key] ? 'text-mint' : 'text-red-300')}><span className={'h-2 w-2 rounded-full ' + (health[key] ? 'bg-mint shadow-[0_0_10px_#75e0bc]' : 'bg-red-400')} />{health[key] ? 'Operational' : 'Offline'}</span></div><h3 className="mt-8 text-lg font-bold">{service.name}</h3><div className="mono mt-2 text-xs text-slate-500">{service.url.replace('http://', '')}</div></div>)}</div></div>; }
    function Empty({ text }) { return <div className="p-12 text-center text-sm text-slate-500">{text}</div>; }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
